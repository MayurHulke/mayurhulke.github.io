baseURL: "https://mayurhulke.com/"
locale: "en-gb"
title: "Mayur Hulke"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 5

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  description: "Mayur Hulke is a robotics and autonomy engineer working across perception, manipulation and heavy-machine autonomy."
  author: "Mayur Hulke"
  # Share card shown when the site is linked on LinkedIn, X, Slack and so on.
  images: ["img/og-card.png"]
  # Cloudflare Web Analytics beacon token (Analytics & Logs -> Web Analytics).
  # Empty means no beacon is emitted.
  cloudflareAnalyticsToken: "36902b11a7924887b2453dce9c34d71a"
  mainSections: ["posts"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  showtoc: false
  tocopen: false

  assets:
    disableHLJS: true

  # Header logo: the "I am Groot" wordmark with a waving Baby Groot. Acts as home button.
  label:
    text: "I am Groot"
    icon: "img/groot.gif"
    iconReducedMotion: "img/groot-static.png"
    iconHeight: 34

  # Home page profile-mode hero
  profileMode:
    enabled: true
    title: "Mayur Hulke"
    imageUrl: "img/profile/lab.jpg"
    imageWidth: 1280
    imageHeight: 721
    imageTitle: "Mayur Hulke working in the robotics lab at Almetra"

  socialIcons:
    - name: github
      url: "https://github.com/MayurHulke"
    - name: linkedin
      url: "https://www.linkedin.com/in/mayurhulke/"
    - name: x
      url: "https://x.com/LetstalkRobots"
    - name: youtube
      url: "https://www.youtube.com/@LetsTalkWithRobots"
    - name: instagram
      url: "https://www.instagram.com/themayurhulk/"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

outputs:
  home: ["HTML", "RSS", "JSON"]

menu:
  main:
    - identifier: story
      name: Story
      url: /story/
      weight: 10
    - identifier: experience
      name: CV
      url: /experience/
      weight: 15

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    style: monokai
